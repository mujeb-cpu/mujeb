    <script>
      // Resolve the theme before first paint so a hard refresh never flashes
      // the wrong background. Mirrors ThemeProvider's "theme" storage key.
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var dark =
            stored === "dark" ||
            ((!stored || stored === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          // Only set the class. The stylesheet owns the background via
          // `html { background: var(--background) }`, so nothing goes stale
          // inline when the user later toggles themes.
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.classList.toggle("light", !dark);
        } catch (e) {}
      })();
    </script>
  </head>
